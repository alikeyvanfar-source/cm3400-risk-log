const KEY="cm3400_part6_v1", GPT_URL="https://chatgpt.com/g/g-6a4dad32d908819187587b8c38626c41-narrative-assessor";
const app=document.getElementById("app");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function newRisk(){return{id:"",feature:"",cause:"",event:"",cons:"",P:"",I:"",score:"",band:"",resp:""}}
let S=load()||{name:"",project:"Midtown Medical Office Building",ctx:"",step:0,started:false,risks:[],narr:{feat:"",liab:"",impact:"",mit:""},uploadMsg:null};
if(!S.risks)S.risks=[];if(!S.narr)S.narr={feat:"",liab:"",impact:"",mit:""};
while(S.risks.length<5)S.risks.push(newRisk());
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(flash){localStorage.setItem(KEY,JSON.stringify(S));if(flash){var e=document.getElementById("saved");if(e){e.textContent="Saved ✓";setTimeout(function(){if(e)e.textContent=""},1100)}}}

const CRIT=[
 ["High-risk features of work","Name the specific activities or scopes that carry the most risk (a shared tower crane, long-lead switchgear, a winter structural pour)."],
 ["Liability & insurance","Tie each risk to who bears it and how it is covered — bonds, builder's risk, CGL — and how the contract allocates it."],
 ["Impact on the completion date","Explain how each risk, if it fires, threatens the schedule — which activity slips, float vs. substantial completion, LD exposure."],
 ["The team's plan to mitigate","State the response for each — avoid, transfer, mitigate, or accept — and the concrete control action."],
];
const RUBRIC=[["High-risk features of work — named & specific",20],["Liability & insurance / bonds discussed",20],["Impact on the completion date explained",20],["Mitigation plan — responses + control actions",20],["Grounded in your five risks (each scored P×I & banded)",12],["Professional length & specificity",8]];
const EXAMPLE={
 feat:"The Midtown Medical Office Building is a six-story, fast-track project on a tight downtown corner, and three features of work carry most of the risk: a single shared tower crane that every trade competes for, a long-lead electrical switchgear order on the critical path, and a structural deck pour scheduled through the coldest weeks of winter.",
 liab:"These risks are allocated deliberately. The switchgear delivery risk is transferred to the vendor through a liquidated-damages clause, and the winter-pour workmanship risk is backed by the subcontractor's performance bond. Builder's risk insurance covers physical loss to the work in place, and the general contractor carries commercial general liability for third-party claims on the crowded corner site.",
 impact:"If the switchgear slips three weeks, it pushes electrical rough-in into the winter-pour window, which leans harder on the one shared crane — so a single delivery miss cascades into a slipped substantial-completion date, not just a late panel.",
 mit:"The team mitigates the crane conflict with a locked daily lift schedule and a named owner, transfers the switchgear risk by contract while keeping a rental-generator fallback, and accepts the residual winter-weather risk with a heated-enclosure control action logged in the register and re-checked at every pour.",
};

function bandOf(s){s=+s;return s>=20?"Extreme":s>=15?"Critical":s>=10?"High":s>=5?"Moderate":s>=1?"Minor":""}
function computeRow(r){if(r&&r.P&&r.I){var s=(+r.P)*(+r.I);r.score=String(s);r.band=bandOf(s)}return r}
function parseCSV(text){const rows=[];let i=0,cell="",row=[],q=false;
  while(i<text.length){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cell+='"';i++}else q=false}else cell+=c}
    else{if(c=='"')q=true;else if(c==",")row.push(cell),cell="";else if(c=="\n"){row.push(cell);rows.push(row);row=[];cell=""}else if(c=="\r"){}else cell+=c}
    i++}
  if(cell.length||row.length){row.push(cell);rows.push(row)}return rows}
function ingestCSV(text){const rows=parseCSV(text);let hi=-1;
  for(let r=0;r<rows.length;r++){const h=rows[r].map(x=>(x||"").toLowerCase());
    if(h[0]&&h[0].indexOf("risk id")>=0&&h.some(x=>x.indexOf("cause")>=0)&&h.some(x=>x.indexOf("consequence")>=0)){hi=r;break}}
  if(hi<0)throw new Error("Could not find the register header in this CSV.");
  const head=rows[hi].map(x=>(x||"").toLowerCase());const col=n=>head.findIndex(x=>x.indexOf(n)>=0);
  const ci={cat:col("category"),cause:col("cause"),event:col("event"),cons:col("consequence"),band:col("band"),resid:col("residual")};
  const reg={};
  for(let r=hi+1;r<rows.length;r++){const c=rows[r];if(!/^R\d+$/i.test((c[0]||"").trim())){if(Object.keys(reg).length&&(c.length<=1||!c[0]))break;else continue}
    const rid=(c[0]||"").trim().toUpperCase();
    reg[rid]={id:rid,feature:(ci.cat>=0?c[ci.cat]:"")||"",cause:(ci.cause>=0?c[ci.cause]:"")||"",event:(ci.event>=0?c[ci.event]:"")||"",cons:(ci.cons>=0?c[ci.cons]:"")||"",band:(ci.band>=0?c[ci.band]:"")||"",resp:(ci.resid>=0?c[ci.resid]:"")||"",P:"",I:"",score:""}}
  let ni=-1;for(let r=hi+1;r<rows.length;r++){const h=rows[r].map(x=>(x||"").toLowerCase());if(h[0]&&h[0].indexOf("risk id")>=0&&h.some(x=>x==="score")){ni=r;break}}
  if(ni>=0){const nh=rows[ni].map(x=>(x||"").toLowerCase());const sc=nh.indexOf("score"),bc=nh.indexOf("band"),rtc=nh.findIndex(x=>x.indexOf("response type")>=0),rac=nh.findIndex(x=>x.indexOf("response action")>=0);
    for(let r=ni+1;r<rows.length;r++){const c=rows[r];const rid=(c[0]||"").trim().toUpperCase();if(!/^R\d+$/i.test(rid))continue;
      const sv=sc>=0?parseInt(c[sc]||"",10):NaN;if(!isNaN(sv)&&sv>0&&reg[rid]){reg[rid].score=String(sv);if(!reg[rid].band&&bc>=0)reg[rid].band=c[bc]||bandOf(sv);
        const rt=rtc>=0?(c[rtc]||""):"",ra=rac>=0?(c[rac]||""):"";if(rt||ra)reg[rid].resp=(rt?rt+": ":"")+ra}}}
  return Object.values(reg)}
function ingestJSON(text){const d=JSON.parse(text);const ent=d.entries||{};
  let grp=(d._identity&&d._identity.group)?String(d._identity.group):null;let E=null;
  if(grp&&ent[grp])E=ent[grp];
  else{const keys=Object.keys(ent);if(keys.length===1)E=ent[keys[0]];else{let best=null,bn=-1;keys.forEach(k=>{const n=Object.keys(ent[k]||{}).length;if(n>bn){bn=n;best=k}});E=ent[best]||{}}}
  if(!E||typeof E!=="object")throw new Error("No risk entries found in this JSON.");
  const agg=a=>{const v=(a||[]).filter(x=>x>0);return v.length?Math.max.apply(null,v):0};
  const out=[];
  Object.keys(E).forEach(rid=>{if(!/^R\d+$/i.test(rid))return;const e=E[rid]||{};const rt=e.rt||{};
    let P=0,I=0;Object.keys(rt).forEach(k=>{const a=agg(rt[k]);if(k[0]==="c")P=Math.max(P,a);else if(k[0]==="e")I=Math.max(I,a)});
    const Sc=(P&&I)?P*I:0;let resp="";const rsp=e.rsp||{};const rk=Object.keys(rsp).find(k=>{const v=rsp[k]||{};return v.t||v.a});if(rk){const v=rsp[rk];resp=(v.t?v.t+": ":"")+(v.a||"")}
    out.push({id:rid.toUpperCase(),feature:e.category||"",cause:e.cause||"",event:e.event||"",cons:e.consequence||"",P:P?String(P):"",I:I?String(I):"",score:Sc?String(Sc):"",band:bandOf(Sc),resp:resp})})
  return out}
function applyUpload(list){list=list.filter(r=>r&&(r.score||r.cause||r.feature));
  list.sort((a,b)=>(parseInt(b.score||"0",10)||0)-(parseInt(a.score||"0",10)||0));
  const top=list.slice(0,5);let n=0;const need=[];
  for(let i=0;i<5;i++){const r=top[i]||{};S.risks[i]=Object.assign(newRisk(),{id:r.id||"",feature:r.feature||"",cause:r.cause||"",event:r.event||"",cons:r.cons||"",P:r.P||"",I:r.I||"",score:r.score||"",band:r.band||"",resp:r.resp||""});
    if(r.id)n++;if(r.id&&!(r.cause&&r.cons))need.push(r.id)}
  S.uploadMsg={ok:true,txt:"Loaded your "+n+" most significant risk"+(n===1?"":"s")+" from your register"+(need.length?" — confirm the cause/consequence for "+need.join(", ")+".":".")};save()}
function handleFile(file){const rd=new FileReader();rd.onload=function(){try{const txt=rd.result;let list;
    if(/\.json$/i.test(file.name)||/^\s*\{/.test(txt))list=ingestJSON(txt);else list=ingestCSV(txt);
    if(!list.length)throw new Error("No risks were found in the file.");applyUpload(list);render()
  }catch(e){S.uploadMsg={ok:false,txt:"Couldn't read that file: "+e.message+"  You can still type your five risks below."};save();render()}};
  rd.onerror=function(){S.uploadMsg={ok:false,txt:"Could not open that file."};save();render()};rd.readAsText(file)}
function wc(s){return (s||"").trim()?s.trim().split(/\s+/).length:0}
function regRows(){return S.risks.filter(function(r){return r&&(r.feature||r.cause||r.cons)})}

function render(){window.scrollTo(0,0);if(!S.started||!(S.name&&S.name.trim()))return cover();
  if(S.step===0)return pgObjective();if(S.step===1)return pgRisks();if(S.step===2)return pgDraft();return pgFinish()}
function shell(step,inner){const labels=["The objective","Your 5 risks","Write it","PDF + Assessor"];
  app.innerHTML='<header class="top"><div class="wrap row"><div class="a2"><span class="mk">A<sup>2</sup></span><span class="nm">A² LEARNING STUDIO</span></div>'+

    '<div class="page"><div class="wrap">'+inner+'</div></div>'+

  app.innerHTML='<section class="cover"><div class="wrap"><div class="bar"></div>'+
    '<div class="kicker" style="color:var(--amber)">CM 3400 / CM 6600 · COURSE PROJECT · PART 6 · OUTLINE #15 — NARRATE</div>'+
    '<h1>Project Risk &amp; Safety Narrative</h1>'+

    '<button class="btn-amber" id="go">'+(resume?"Resume ▶":"Begin ▶")+'</button>'+
    '<div class="how">Four steps: the objective → load your five biggest risks (your Part-5 file) → write the four moves → download your PDF and get scored by the <b>Narrative Assessor</b> (up to 3 attempts, automatic Score Sheet). You submit BOTH PDFs to D2L. Work saves in this browser automatically.</div>'+
  '</div></section>';
  document.getElementById("go").onclick=function(){const nm=document.getElementById("nm").value.trim();if(!nm){document.getElementById("nm").focus();return}
    S.name=nm;S.project=document.getElementById("pj").value.trim()||"Midtown Medical Office Building";S.started=true;save();render()}}
function pgObjective(){shell(0,'<div class="card"><div class="kicker">Step 1 · why part 6 exists</div>'+
    '<h2>The objective — a capstone simulation</h2>'+
    '<p class="mut">In your <b>Senior Capstone (CM 4900)</b>, <b>Tab 5 — Site Logistics, Safety &amp; Project Risk (SLO 3, 7)</b> requires a <b>Risk &amp; Safety Narrative</b> plus a <b>register of your five most significant risks</b>. Part 6 simulates that now, using the register YOU built in Parts 1–5 — same skill, same criteria, a year early. This page is yours to reuse for the real capstone.</p>'+
    '<div class="crit"><div class="cl">The capstone brief you are meeting</div>'+

    CRIT.map(function(c,i){return '<div style="margin:7px 0"><b>'+(i+1)+". "+esc(c[0])+'</b> <span class="mut">— '+esc(c[1])+'</span></div>'}).join("")+

    '<h2>Load or enter your five risks</h2>'+

    if(k==="P"||k==="I"){computeRow(S.risks[i]);const r=S.risks[i];const sc=host.querySelector('[data-sc="'+i+'"]');if(sc)sc.textContent=r.score?("Score = "+r.score+" ("+r.P+"×"+r.I+") → "+r.band):"Score = P × I";
      const bd=host.querySelector('[data-band="'+i+'"]');if(bd){bd.textContent=r.band||"";bd.className="band "+(r.band?"b-"+r.band:"");bd.style.display=r.band?"":"none"}}
    save(true);refresh()});
  refresh();

function nowStr(){try{return new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}catch(e){return ""}}
async function makePDF(btn){if(!window.jspdf){alert("PDF tool not loaded — check your connection and reload.");return}
  var old=btn.innerHTML;btn.disabled=true;btn.textContent="Generating…";
  try{var jsPDF=window.jspdf.jsPDF,doc=new jsPDF({unit:"pt",format:"letter",compress:true});
    var W=612,H=792,M=54,cw=W-2*M,INK=[19,36,59],AMB=[185,131,29],GREY=[91,102,117],BODY=[34,38,43],LINE=[228,222,205];
    var y=M;function tc(c){doc.setTextColor(c[0],c[1],c[2])}
    function san(s){return String(s==null?"":s).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/→/g," -> ").replace(/×/g,"x").replace(/[–—]/g,"-").replace(/[^\x00-\x7F]/g,"")}
    function foot(){doc.setFont("helvetica","normal");doc.setFontSize(8);tc(GREY);doc.setDrawColor(LINE[0],LINE[1],LINE[2]);doc.line(M,H-40,W-M,H-40);doc.text("A2 Learning Studio - CM 3400/6600 - Course Project Part 6 - Risk & Safety Narrative",M,H-28);doc.text(String(doc.internal.getNumberOfPages()),W-M,H-28,{align:"right"})}
    function np(){foot();doc.addPage();y=M}function ensure(h){if(y+h>H-52)np()}
    function kick(t){ensure(16);doc.setFont("helvetica","bold");doc.setFontSize(9);tc(AMB);doc.text(san(t).toUpperCase(),M,y);y+=13}
    function para(t,fs,lh){doc.setFont("helvetica","normal");doc.setFontSize(fs);tc(BODY);doc.splitTextToSize(san(t),cw).forEach(function(l){ensure(lh);doc.text(l,M,y);y+=lh})}
    doc.setFillColor(INK[0],INK[1],INK[2]);doc.rect(0,0,W,124,"F");doc.setFillColor(AMB[0],AMB[1],AMB[2]);doc.rect(M,44,42,5,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(224,161,44);doc.text("CM 3400 / CM 6600  -  COURSE PROJECT  -  PART 6 (OUTLINE #15): NARRATE",M,38);
    doc.setFont("times","bold");doc.setFontSize(21);doc.setTextColor(255,255,255);doc.text("Project Risk & Safety Narrative",M,74);
    doc.setFont("times","italic");doc.setFontSize(11);doc.setTextColor(205,214,228);doc.text(san((S.project||"Project")+"  -  Capstone Tab 5 (Site Logistics, Safety & Project Risk)"),M,96);
    y=148;doc.setFont("helvetica","normal");doc.setFontSize(11);tc(BODY);
    doc.text("Student:  "+san(S.name||""),M,y);y+=17;doc.text("Date:  "+san(nowStr()),M,y);y+=24;
    [["Opening - high-risk features of work","feat"],["Liability & insurance","liab"],["Impact on the completion date","impact"],["The mitigation plan","mit"]].forEach(function(f){kick(f[0]);para(S.narr[f[1]]||"(left blank)",10.5,14);y+=8});
    np();kick("Five most significant risks - risk register");y+=4;
    var rs=regRows();var cols=[["#",18],["ID",42],["Feature / risk",96],["Cause -> Event -> Consequence",168],["Score",44],["Band",50],["Response",86]];
    var xs=[M];for(var ci=0;ci<cols.length;ci++)xs.push(xs[ci]+cols[ci][1]);
    function cellLines(txt,w){return doc.splitTextToSize(san(txt),w-10)}
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);
    var rowsData=rs.map(function(r,i){var sc=r.score?(r.score+(r.P&&r.I?" ("+r.P+"x"+r.I+")":"")):"-";
      return [String(i+1),r.id||"-",r.feature||"-",[r.cause,r.event,r.cons].filter(Boolean).join(" -> ")||"-",sc,r.band||"-",r.resp||"-"]});
    var maxLines=1;rowsData.forEach(function(rd){rd.forEach(function(cell,ci){var n=cellLines(cell,cols[ci][1]).length;if(n>maxLines)maxLines=n})});
    var rowH=maxLines*10+8;
    doc.setFillColor(INK[0],INK[1],INK[2]);doc.rect(M,y,cw,18,"F");doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(255,255,255);
    cols.forEach(function(c,ci){doc.text(san(c[0]),xs[ci]+5,y+12)});y+=18;
    rowsData.forEach(function(rd,ri){ensure(rowH);if(ri%2===1){doc.setFillColor(250,247,240);doc.rect(M,y,cw,rowH,"F")}
      doc.setFont("helvetica","normal");doc.setFontSize(8.5);tc(BODY);
      rd.forEach(function(cell,ci){var lines=cellLines(cell,cols[ci][1]);var cx=(ci===0||ci===4||ci===5)?xs[ci]+cols[ci][1]/2:xs[ci]+5;var al=(ci===0||ci===4||ci===5)?"center":"left";
        for(var li=0;li<lines.length;li++)doc.text(lines[li],cx,y+12+li*10,{align:al})});
      doc.setDrawColor(LINE[0],LINE[1],LINE[2]);doc.line(M,y+rowH,W-M,y+rowH);y+=rowH});
    foot();doc.save("Part6_Narrative_"+(S.name||"student").replace(/[^a-z0-9]+/gi,"_")+".pdf");
    var n=document.getElementById("note");if(n){n.style.display="block";n.textContent="Downloaded ✓  Now take it to the Narrative Assessor below — then submit BOTH PDFs to D2L."}
  }catch(e){alert("Could not build PDF: "+e.message)}
  btn.disabled=false;btn.innerHTML=old}
